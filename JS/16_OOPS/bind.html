<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>Click me</button>
</body>
<script>
class React{
    constructor(){
        this.library = "React"; 
        this.server = "http://localhost:3000";
        document.
             querySelector("button")
             .addEventListener("click", this.handleclick.bind(this));
    }
    //bind is used to bind the current object to the function so that we can access the properties of the class inside the function.
    handleclick(){
        console.log("Button clicked");
        console.log(this);
      
    }
}
const app = new React();
    
</script>
</html>
