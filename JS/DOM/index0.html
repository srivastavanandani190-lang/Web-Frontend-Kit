<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="parent">
        <div class="day">monday</div>
        <div class="day">tuesday</div>
        <div class="day">wednesday</div>
        <div class="day">thursday</div>
        <div class="day">friday</div>
        <div class="day">saturday</div>
        <div class="day">sunday</div>
    </div>
</body>
<script>
const parent = document.querySelector('.parent');
console.log(parent);//all div as days
console.log(parent.children);//html collection
console.log("Nodes:", parent.childNodes);//node list of all children
console.log(parent.children[0].innerHTML);//first child

for (let i = 0; i < parent.children.length; i++) {
    console.log(parent.children[i].innerHTML);
}
parent.children[1].style.color="green";
console.log(parent.firstElementChild);
console.log(parent.lastElementChild);

const dayone = document.querySelector('.day');//first day
console.log(dayone);//monday
console.log(dayone.parentElement);//parent div
console.log(dayone.nextElementSibling);//tuesday
console.log(dayone.previousElementSibling);//null

    </script>
</html>
