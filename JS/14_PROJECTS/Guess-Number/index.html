<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess-Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Try to guess the number between 1 and 100!</p>
        <p>You have 10 attempts to guess the right number!</p>
</br>
      <form class="form">
        <label for="guessField" id="guess">Enter your guess:</label>
        <input type="text" id="guessField" class="guessField" placeholder="Enter a number">
        <input type="submit" id="guessSubmit" value="Submit guess" class="guessSubmit">
      </form>
      <div class="resultParas">
        <p>Previous guesses: <span class="guesses"></span></p>
        <p>Remaining attempts: <span class="lastResult">10</span></p>
        <p class="lowOrHi"></p>
      </div>
    </div>
</body>
<script src="script.js"></script>
</html>
