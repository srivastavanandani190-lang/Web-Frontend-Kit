 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>
</head>
<style>

    /* Remove normal table layout */
    table {
        width: 90%;
        margin: 30px auto;
        border: none;
        border-collapse: separate;
    }

    /* Header */
    thead {
        display: none;
    }

    /* 3 CARDS IN ONE ROW */
    #data {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        width: 100%;
    }

    /* Each <tr> becomes a CARD */
    #data tr {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;

        background: white;
        border: 2px solid rgb(114, 3, 155);
        border-radius: 15px;

        padding: 20px;
        min-height: 350px;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);

        transition: 0.3s;
    }

    /* Card hover effect */
    #data tr:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    /* All cells */
    #data td {
        border: none;
        text-align: center;
        color: rgb(114, 3, 155);
        font-size: 20px;
        padding: 8px;
    }

    /* Serial number */
    #data td:nth-child(1) {
        font-size: 16px;
        color: gray;
        align-self: flex-start;
    }

    /* Product title */
    #data td:nth-child(2) {
        font-size: 22px;
        font-weight: bold;
        margin: 5px 0;
    }

    /* Product image */
    #data td:nth-child(3) img {
        width: 150px !important;
        height: 150px !important;
        object-fit: contain;
    }

    /* Category */
    #data td:nth-child(4) {
        color: #555;
        font-size: 18px;
    }

    /* Price */
    #data td:nth-child(5) {
        font-size: 23px;
        font-weight: bold;
        color: rgb(114, 3, 155);
    }


    /* TABLET - 2 cards */
    @media (max-width: 900px) {
        #data {
            grid-template-columns: repeat(2, 1fr);
        }
    }


    /* MOBILE - 1 card */
    @media (max-width: 600px) {
        #data {
            grid-template-columns: 1fr;
        }
    }

</style>
<body>
    <table>
        <thead>
            <tr>
                <th>Serial No.</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    <script>
      const ele=document.getElementById("data");
      const URL="https://dummyjson.com/products";
      async function fetchData(){
        try {
            const response=await fetch(URL);//calling API hence await is used
            const data=await response.json();//convertor json to object
            console.log(data.products);
            let row="";//null string
            data.products.map((product,index)=>{
            row+=`<tr>
                <td>${index+1}</td>
                <td>${product.title}</td>
                <td><img src="${product.images[0]}" width="100px" height="100px"></td>
                <td>${product.category}</td>
                <td>${product.price}</td>
            </tr>`;
           });
           ele.innerHTML=row;   //printing data in table
        } catch (error) {
          console.error('Error fetching data:', error);
        }
      }
      fetchData();
      //fetching data from json
</script>
</body>

</html>
