<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Function</title>
</head>
<style>
    .box{
        width: 300px;
        height: 300px;
        background-color: rgb(154, 138, 170);
        color:black;
        gap: 10px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
        text-transform: uppercase;
        height: 400px;
        width: 400px;
    }
    .box button{
        width: 150px;
        height: 40px;
        background-color: rgb(0, 0, 0);
        color: white;
        border-radius: 10px;
    }
    </style>
<body>

    <div class="box">
        <h1>Callback Function</h1>
        <button onclick="callme(check)">START</button>
    </div>

    <script>
        function check(name, password) {
            if (name == "Nandani" && password == "1234") {
                alert("Welcome Nandani");
            }
            else {
                alert("Invalid user");
            }
        }

        function callme(callback) {
            let name = prompt("Enter your name:");
            let password = prompt("Enter your password:");

            document.write(
                "Your entered name is " + name +
                " and your entered password is " + password
            );

            callback(name, password);
        }
    </script>

</body>
</html>
